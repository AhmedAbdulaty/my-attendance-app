<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Attendance Pro</title>

<style>
  body {
    font-family: Arial;
    background: linear-gradient(135deg,#0f2027,#2c5364);
    color:#fff;
    text-align:center;
    animation: fadeIn 1s ease;
  }

  @keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
  }

  .box {
    background:#fff;
    color:#000;
    padding:20px;
    margin:40px auto;
    width:350px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }

  input {
    padding:10px;
    width:80%;
    margin:5px;
    border-radius:8px;
    border:1px solid #ccc;
  }

  button {
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
  }

  button:hover {
    transform:scale(1.05);
  }

  .add {background:#28a745;color:#fff;}
  .delete {background:red;color:#fff;}

  li {
    background:#f1f1f1;
    margin:5px;
    padding:10px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  small {color:gray;}
</style>
</head>

<body>

<div class="box">
  <h2>📋 Attendance Pro</h2>

  <input type="text" id="name" placeholder="اكتب اسمك">
  <br>
  <button class="add" onclick="addName()">تسجيل</button>

  <br>
  <input type="text" id="search" placeholder="🔍 بحث" onkeyup="filterNames()">

  <h3>👥 عدد الحضور: <span id="count">0</span></h3>

  <button onclick="exportCSV()">📤 تحميل CSV</button>

  <ul id="list"></ul>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allData = [];

// إضافة
function addName() {
  let name = document.getElementById("name").value;
  if (!name) return;

  db.collection("attendance").add({
    name: name,
    time: new Date().toLocaleString()
  });

  document.getElementById("name").value = "";
}

// عرض
db.collection("attendance")
.orderBy("time","desc")
.onSnapshot(snapshot => {
  let list = document.getElementById("list");
  list.innerHTML = "";
  allData = [];

  snapshot.forEach(doc => {
    let data = doc.data();
    data.id = doc.id;
    allData.push(data);

    createItem(data);
  });

  document.getElementById("count").innerText = allData.length;
});

// عنصر
function createItem(data){
  let li = document.createElement("li");

  li.innerHTML = `
    <div>
      ${data.name}
      <small>${data.time}</small>
    </div>
    <button class="delete" onclick="deleteItem('${data.id}')">❌</button>
  `;

  document.getElementById("list").appendChild(li);
}

// حذف عنصر
function deleteItem(id){
  db.collection("attendance").doc(id).delete();
}

// بحث
function filterNames(){
  let val = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");
  list.innerHTML = "";

  allData
    .filter(x => x.name.toLowerCase().includes(val))
    .forEach(createItem);
}

// تصدير CSV
function exportCSV(){
  let csv = "Name,Time\n";

  allData.forEach(x=>{
    csv += `${x.name},${x.time}\n`;
  });

  let blob = new Blob([csv],{type:"text/csv"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "attendance.csv";
  a.click();
}
</script>

</body>
</html>
