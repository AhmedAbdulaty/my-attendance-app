<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Attendance Pro Secure</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f2027,#2c5364);
  color:#fff;
  text-align:center;
}

.box {
  background:#fff;
  color:#000;
  padding:20px;
  margin:40px auto;
  width:350px;
  border-radius:15px;
}

input {
  padding:10px;
  width:80%;
  margin:5px;
}

button {
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.add {background:#28a745;color:#fff;}
.delete {background:red;color:#fff;}

li {
  background:#f1f1f1;
  margin:5px;
  padding:10px;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
}

small {color:gray;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="box">
  <h2>🔐 تسجيل الدخول</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">دخول</button>
</div>

<!-- APP -->
<div id="appBox" class="box" style="display:none;">
  <h2>📋 Attendance Pro</h2>

  <input type="text" id="name" placeholder="اكتب اسمك">
  <br>
  <button class="add" onclick="addName()">تسجيل</button>

  <br>
  <input type="text" id="search" placeholder="🔍 بحث" onkeyup="filterNames()">

  <h3>👥 عدد الحضور: <span id="count">0</span></h3>

  <button onclick="exportCSV()">📤 تحميل CSV</button>

  <ul id="list"></ul>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAv5tn5MpzvwSi8aRZNdb39XawpFTBMKXI",
  authDomain: "attendance-app-4860b.firebaseapp.com",
  projectId: "attendance-app-4860b",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allData = [];
let isAdmin = false;

// 🔐 Login
function login(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  firebase.auth().signInWithEmailAndPassword(email,password)
  .then(userCredential=>{
    let uid = userCredential.user.uid;

    db.collection("users").doc(uid).get().then(doc=>{
      if(doc.exists && doc.data().isAdmin){
        isAdmin = true;
        alert("👑 Admin");
      }

      document.getElementById("loginBox").style.display="none";
      document.getElementById("appBox").style.display="block";
    });
  })
  .catch(()=> alert("❌ بيانات غلط"));
}

// 🔐 حماية الصفحة
firebase.auth().onAuthStateChanged(user=>{
  if(user){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("appBox").style.display="block";
  }else{
    document.getElementById("loginBox").style.display="block";
    document.getElementById("appBox").style.display="none";
  }
});

// ➕ إضافة
function addName(){
  let name = document.getElementById("name").value;
  if(!name) return;

  db.collection("attendance").add({
    name:name,
    time:new Date().toLocaleString()
  });

  document.getElementById("name").value="";
}

// 📥 عرض البيانات
db.collection("attendance")
.orderBy("time","desc")
.onSnapshot(snapshot=>{
  let list = document.getElementById("list");
  list.innerHTML="";
  allData=[];

  snapshot.forEach(doc=>{
    let data = doc.data();
    data.id = doc.id;
    allData.push(data);

    let li = document.createElement("li");
    li.innerHTML = `
      <div>
        ${data.name}
        <small>${data.time}</small>
      </div>
      ${isAdmin ? `<button class="delete" onclick="deleteItem('${data.id}')">❌</button>` : ""}
    `;

    list.appendChild(li);
  });

  document.getElementById("count").innerText = allData.length;
});

// ❌ حذف
function deleteItem(id){
  if(!isAdmin) return;
  db.collection("attendance").doc(id).delete();
}

// 🔍 بحث
function filterNames(){
  let val = document.getElementById("search").value.toLowerCase();
  let list = document.getElementById("list");
  list.innerHTML="";

  allData
  .filter(x=>x.name.toLowerCase().includes(val))
  .forEach(data=>{
    let li = document.createElement("li");
    li.innerHTML = `
      <div>
        ${data.name}
        <small>${data.time}</small>
      </div>
    `;
    list.appendChild(li);
  });
}

// 📤 تحميل CSV (Admin فقط)
function exportCSV(){
  if(!isAdmin){
    alert("❌ مش مسموح");
    return;
  }

  let csv="Name,Time\n";

  allData.forEach(x=>{
    csv += `${x.name},${x.time}\n`;
  });

  let blob = new Blob([csv]);
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download="attendance.csv";
  a.click();
}
</script>

</body>
</html>
