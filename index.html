<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نظام تسجيل الحضور</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }

    .box {
      background: white;
      color: black;
      padding: 20px;
      margin: 40px auto;
      width: 350px;
      border-radius: 15px;
    }

    input {
      padding: 10px;
      width: 80%;
      margin: 5px;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    .add { background: green; color: white; }
    .clear { background: red; color: white; }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f1f1f1;
      margin: 5px;
      padding: 10px;
      border-radius: 8px;
      color: black;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>📋 تسجيل الحضور</h2>

    <input type="text" id="name" placeholder="اكتب اسمك">
    <br>
    <button class="add" onclick="addName()">تسجيل</button>

    <h3>الحضور:</h3>
    <ul id="list"></ul>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAv5tn5MpzvwSi8aRZNdb39XawpFTBMKXI",
      authDomain: "attendance-app-4860b.firebaseapp.com",
      projectId: "attendance-app-4860b",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function addName() {
      let name = document.getElementById("name").value;
      if (!name) return;

      db.collection("attendance").add({
        name: name,
        time: new Date().toLocaleString()
      });

      document.getElementById("name").value = "";
    }

    function showNames() {
      let list = document.getElementById("list");

      db.collection("attendance")
        .orderBy("time", "desc")
        .onSnapshot((snapshot) => {
          list.innerHTML = "";

          snapshot.forEach((doc) => {
            let data = doc.data();

            let li = document.createElement("li");
            li.innerHTML = `
              ${data.name}
              <br><small>${data.time}</small>
            `;

            list.appendChild(li);
          });
        });
    }

    showNames();
  </script>

</body>
</html>
